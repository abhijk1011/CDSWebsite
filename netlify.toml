# Netlify build settings for CDS.
#
# The site is a full static export (`output: "export"` in next.config.ts), so
# there is no server runtime to host. Pointing `publish` at `out` tells
# Netlify to serve the exported files directly rather than trying to run the
# Next.js server runtime, which is the usual cause of a broken first deploy
# on an exported Next site.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Hashed build assets never change under the same name, so they can be held
# for a year. Everything else is revalidated on each visit.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
